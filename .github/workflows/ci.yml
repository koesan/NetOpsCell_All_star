name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  identity-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/identity-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/identity-service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  incident-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/incident-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/incident-service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  gamification-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gamification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/gamification-service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      # Gateway duz JS oldugu icin derleme adimi yok; en azindan sozdizimi/import
      # dogrulugu node --check ile teyit edilir.
      - run: node --check src/index.js && node --check src/jwt-auth.middleware.js && node --check src/websocket.js && node --check src/common/secrets.js

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ai-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [identity-service, incident-service, gamification-service, gateway, frontend, ai-service]
    steps:
      - uses: actions/checkout@v4
      # docker-compose.yml secrets: bolumu yalnizca calisma zamaninda (up) gerekli dosyalari
      # bekler; build asamasi bunlara ihtiyac duymaz, bu yuzden generate-secrets.sh burada
      # calistirilmiyor (bkz. docs/ARCHITECTURE.md Bolum 19).
      - name: Tum servislerin Docker imajlarini derle
        run: docker compose build
